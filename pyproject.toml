[project]
name = "zotero-cli"
version = "2.1.0"
description = "Zotero CLI for AI agents — SQLite reads + Web API writes"
license = "MIT"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "pyzotero>=1.16,<2",
    "rich>=13.0",
    "markdownify>=1.2.2",
    "openai>=3.35",
    "requests>=2.31",
    "qdrant-client>=1.19.0",
    "typer>=0.27.3",
]

[project.scripts]
zot = "zotero_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: isolated tests for core functions and data access",
    "cli: command, output-contract, and safety-boundary tests",
    "workflows: multi-component and tool-script workflow tests",
]

[tool.coverage.run]
branch = true
source = ["zotero_cli"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "ty>=0.0.90",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_cli"]

[tool.ty.rules]
# 只保留对源码有效的规则；本仓库以 pytest 行为为契约。
unused-ignore-comment = "warn"

[tool.ty.src]
# 源码严格检查；测试大量使用 MagicMock 与动态夹具，静态类型噪声不计入门禁。
include = ["src"]

[tool.ty.terminal]
output-format = "full"
