# Continuous integration for zotero-cli (single supported interpreter: CPython 3.12).
#
# Offline-safe stage: lint, format check, type check, full test suite, and
# wheel/sdist build on CPython 3.12 (the only supported runtime; pyproject
# requires-python ">=3.12,<3.13").
# The dependency audit stage needs the network (PyPI/OSV) and is therefore
# best-effort: it runs weekly and on manual dispatch, never blocks the PR gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency/CVE audit (Mondays 04:00 UTC) - network dependent.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests, package (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync --dev --python 3.12
      - name: Install zsh (completions subprocess tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check
      - name: Test suite
        env:
          NO_COLOR: "1"
          TERM: "dumb"
        run: uv run pytest -q -rf
      - name: Build wheel and sdist
        run: uv build --out-dir /tmp/dist

  dependency-audit:
    name: dependency audit (network, best-effort)
    # Network stage: runs weekly / on demand so transient PyPI/OSV outages do
    # not block pull requests. A red run here is a signal, not a merge gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync --dev --python 3.12
      - name: Audit installed dependencies (pip-audit)
        run: uv run --with pip-audit pip-audit
