# Continuous integration for zotero-cli.
#
# Offline-safe stage: lint, format check, type check, full test suite on the
# minimum and maximum supported Python versions (3.10-3.13), and wheel build.
# The dependency audit stage needs the network (PyPI/OSV) and is therefore
# best-effort: it runs weekly and on manual dispatch, never blocks the PR gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency/CVE audit (Mondays 04:00 UTC) - network dependent.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dev environment
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run python -m mypy src/zotero_cli tools --exclude '(^|/)test_[^/]*\.py$'
      - name: Test suite
        run: uv run pytest -q -rf
      - name: Build wheel and sdist
        run: uv build --out-dir /tmp/dist

  dependency-audit:
    name: dependency audit (network, best-effort)
    # Network stage: runs weekly / on demand so transient PyPI/OSV outages do
    # not block pull requests. A red run here is a signal, not a merge gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync --dev --python 3.12
      - name: Audit installed dependencies (pip-audit)
        run: uv run --with pip-audit pip-audit
